<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель управления — ХАМАБОЗОР</title>

<!--
  ==========================================================================
  АДМИН-ПАНЕЛЬ (визуальный прототип) — ХАМАБОЗОР
  --------------------------------------------------------------------------
  ВАЖНО: это пока витрина с ТЕСТОВЫМИ данными (массив MOCK_ORDERS ниже).
  Реальные заказы сюда пока не попадают — для этого нужно подключить
  источник данных (например Google Sheets или базу данных), см. переписку.

  Пароль ниже (ADMIN_PASSWORD) — просто лёгкая защита от случайных
  посетителей, а не настоящая безопасность: любой, кто откроет исходный
  код страницы, сможет его увидеть. Для реальной защиты нужен бэкенд.
  ==========================================================================
-->

<style>
:root{
  --indigo:#1B2A4A;
  --indigo-2:#233a63;
  --marigold:#E8A33D;
  --marigold-dark:#c98620;
  --brick:#C1442E;
  --cream:#F7F3EA;
  --pistachio:#7A8B5E;
  --ink:#2B2620;
  --paper:#FFFDF8;
  --line:rgba(43,38,32,.12);
  --shadow: 0 8px 24px rgba(27,42,74,.10);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Unbounded',system-ui,sans-serif;font-weight:800;
  letter-spacing:-.01em;color:var(--indigo);margin:0;
}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:none}
input,select{font-family:inherit}

/* ---------- login gate ---------- */
.gate{
  position:fixed;inset:0;background:var(--indigo);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.gate-box{
  background:var(--paper);border-radius:18px;padding:32px;max-width:340px;width:100%;
  text-align:center;box-shadow:var(--shadow);
}
.gate-box h2{font-size:20px}
.gate-box p{font-size:13px;color:#6b655a;margin-top:8px}
.gate-box input{
  width:100%;margin-top:20px;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;font-size:14px;outline:none;background:var(--cream);
}
.gate-box input:focus{border-color:var(--indigo)}
.gate-box button{
  width:100%;margin-top:12px;background:var(--brick);color:#fff;padding:12px;
  border-radius:10px;font-weight:700;font-size:14px;
}
.gate-err{color:var(--brick);font-size:12px;margin-top:10px;display:none}

/* ---------- layout ---------- */
.app{display:none}
.app.show{display:block}
header{
  background:var(--paper);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.header-inner{
  max-width:1280px;margin:0 auto;padding:16px 24px;
  display:flex;align-items:center;gap:16px;
}
.logo{font-family:'Unbounded',sans-serif;font-weight:800;font-size:18px;color:var(--indigo);display:flex;align-items:center;gap:8px}
.logo span{width:9px;height:9px;border-radius:50%;background:var(--brick);display:inline-block}
.logo small{font-family:'Inter';font-weight:600;font-size:12px;color:#8a8478;margin-left:2px}
.header-actions{margin-inline-start:auto;display:flex;gap:10px}
.btn-outline{
  border:1px solid var(--line);background:var(--paper);padding:9px 16px;
  border-radius:999px;font-size:13px;font-weight:700;color:var(--ink);
}

.wrap{max-width:1280px;margin:0 auto;padding:26px 24px 60px}

/* ---------- stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.stat-card{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
}
.stat-label{font-size:12px;color:#8a8478;font-weight:600}
.stat-value{font-family:'Unbounded',sans-serif;font-size:24px;color:var(--indigo);margin-top:8px}
.stat-value.brick{color:var(--brick)}
.stat-sub{font-size:11px;color:#8a8478;margin-top:4px}

/* ---------- filters ---------- */
.filters{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;
}
.date-tabs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.date-tabs button{padding:9px 16px;font-size:13px;font-weight:700;color:var(--ink);background:none}
.date-tabs button.active{background:var(--indigo);color:#fff}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:8px 16px;flex:1;min-width:180px;max-width:320px;
}
.search-box input{border:none;outline:none;background:none;width:100%;font-size:13px}
.status-select{
  border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;
  background:var(--paper);color:var(--ink);font-weight:600;
}
.filters-count{font-size:12px;color:#8a8478;margin-inline-start:auto}

/* ---------- table ---------- */
.table-card{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;
}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a8478;
  padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;
}
tbody td{padding:14px 18px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--cream)}
.order-id{font-weight:700;color:var(--indigo)}
.order-items{color:#6b655a;max-width:260px}
.order-sum{font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px}
.badge-status{
  display:inline-block;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;
}
.badge-new{background:#FDEDD3;color:#a76a10}
.badge-progress{background:#E2E9F5;color:var(--indigo)}
.badge-done{background:#E4EEDD;color:#4c5c3a}
.badge-cancel{background:#F6DEDA;color:var(--brick)}
.empty-row td{text-align:center;color:#8a8478;padding:40px 0}

/* ---------- order modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(27,20,10,.5);z-index:98;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.show{display:flex}
.order-modal{
  background:var(--paper);border-radius:18px;max-width:460px;width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;
}
.om-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.om-head h3{font-size:19px}
.om-close{width:32px;height:32px;border-radius:50%;background:var(--cream);font-size:15px}
.om-date{font-size:12px;color:#8a8478;margin-top:2px}
.om-section{margin-top:18px}
.om-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a8478;font-weight:700;margin-bottom:6px}
.om-line{font-size:14px;margin-top:2px}
.om-items{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.om-item{display:flex;justify-content:space-between;font-size:13px;background:var(--cream);padding:8px 12px;border-radius:10px}
.om-total{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-top:12px;color:var(--indigo)}
.om-status-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.om-status-btn{
  padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--paper);
}
.om-status-btn.active{border-color:transparent}
.om-status-btn.active.st-new{background:#FDEDD3;color:#a76a10}
.om-status-btn.active.st-progress{background:#E2E9F5;color:var(--indigo)}
.om-status-btn.active.st-done{background:#E4EEDD;color:#4c5c3a}
.om-status-btn.active.st-cancel{background:#F6DEDA;color:var(--brick)}
.om-hint{font-size:11px;color:#8a8478;margin-top:14px;line-height:1.5}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  table thead{display:none}
  tbody tr{display:block;padding:14px 18px}
  tbody td{display:flex;justify-content:space-between;padding:6px 0;border:none}
  tbody td::before{content:attr(data-label);font-weight:700;color:#8a8478;font-size:11px}
  tbody tr{border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>

<!-- login gate -->
<div class="gate" id="gate">
  <div class="gate-box">
    <h2>Панель управления</h2>
    <p>ХАМАБОЗОР · вход только для администратора</p>
    <input type="password" id="gatePassword" placeholder="Пароль" onkeydown="if(event.key==='Enter')checkPassword()">
    <button onclick="checkPassword()">Войти</button>
    <div class="gate-err" id="gateErr">Неверный пароль</div>
  </div>
</div>

<div class="app" id="app">
  <header>
    <div class="header-inner">
      <div class="logo"><span></span>ХАМАБОЗОР <small>· Админ</small></div>
      <div class="header-actions">
        <a class="btn-outline" href="index.html">← На сайт</a>
        <button class="btn-outline" onclick="logout()">Выйти</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Заказов за период</div>
        <div class="stat-value" id="statCount">0</div>
        <div class="stat-sub">по текущему фильтру</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Сумма за период</div>
        <div class="stat-value" id="statSum">0 смн</div>
        <div class="stat-sub">без учёта отменённых</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Новые заказы</div>
        <div class="stat-value brick" id="statNew">0</div>
        <div class="stat-sub">требуют обработки</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Средний чек</div>
        <div class="stat-value" id="statAvg">0 смн</div>
        <div class="stat-sub">по текущему фильтру</div>
      </div>
    </div>

    <div class="filters">
      <div class="date-tabs" id="dateTabs"></div>
      <div class="search-box">
        🔎 <input id="searchInput" placeholder="Поиск по имени или телефону...">
      </div>
      <select class="status-select" id="statusSelect">
        <option value="all">Все статусы</option>
        <option value="new">Новый</option>
        <option value="progress">В обработке</option>
        <option value="done">Выполнен</option>
        <option value="cancel">Отменён</option>
      </select>
      <div class="filters-count" id="filtersCount"></div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>№</th><th>Дата</th><th>Клиент</th><th>Телефон</th>
            <th>Товары</th><th>Сумма</th><th>Статус</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- order detail modal -->
<div class="modal-overlay" id="orderModalOverlay">
  <div class="order-modal" id="orderModal"></div>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
/* ==========================================================================
   НАСТРОЙКИ
   ========================================================================== */
const ADMIN_PASSWORD = "hamabozor2026"; // смени на свой пароль

/* ==========================================================================
   ТЕСТОВЫЕ ЗАКАЗЫ (потом заменим на реальные данные)
   ========================================================================== */
const STATUS_LABEL = { new:'Новый', progress:'В обработке', done:'Выполнен', cancel:'Отменён' };
const STATUS_CLASS = { new:'badge-new', progress:'badge-progress', done:'badge-done', cancel:'badge-cancel' };

function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return d; }

const MOCK_ORDERS = [
  { id:1042, date:daysAgo(0),  name:'Фарход Раҳимов', phone:'+992 93 111 22 33', address:'кӯч. Рӯдакӣ 45',
    items:[{name:'Гӯшмонакҳои бесим', qty:1, price:249},{name:'Пауэрбанк 20000mAh', qty:1, price:280}], status:'new', comment:'' },
  { id:1041, date:daysAgo(0),  name:'Мадина Каримова', phone:'+992 90 555 44 12', address:'',
    items:[{name:'Сумкаи занона', qty:1, price:340}], status:'new', comment:'Агар мумкин бошад, фардо расонед' },
  { id:1040, date:daysAgo(1),  name:'Абдуллоҳ Насриддинов', phone:'+992 98 777 21 09', address:'мкр. 32, х.14',
    items:[{name:'Куртаи мардона', qty:1, price:450}], status:'progress', comment:'' },
  { id:1039, date:daysAgo(1),  name:'Зарина Юсупова', phone:'+992 92 333 87 65', address:'кӯч. Айнӣ 12',
    items:[{name:'Ҷузвдони мактабӣ', qty:2, price:210}], status:'progress', comment:'' },
  { id:1038, date:daysAgo(2),  name:'比 Комил Шарипов', phone:'+992 93 222 10 44', address:'',
    items:[{name:'Соати ҳушманд', qty:1, price:890}], status:'done', comment:'' },
  { id:1037, date:daysAgo(3),  name:'Ситора Раҷабова', phone:'+992 90 111 99 22', address:'кӯч. Бухоро 8',
    items:[{name:'Куртаи пахтагӣ', qty:3, price:90},{name:'Ҷинси занона', qty:1, price:260}], status:'done', comment:'' },
  { id:1036, date:daysAgo(4),  name:'Ҷамшед Олимов', phone:'+992 98 456 78 90', address:'',
    items:[{name:'Баландгӯяки Bluetooth', qty:1, price:320}], status:'cancel', comment:'Клиент отказался' },
  { id:1035, date:daysAgo(6),  name:'Наргис Тошева', phone:'+992 93 654 32 11', address:'мкр. 27',
    items:[{name:'Ҳамён', qty:1, price:95},{name:'Ҷузвдони сафарӣ', qty:1, price:460}], status:'done', comment:'' },
  { id:1034, date:daysAgo(9),  name:'Далер Қосимов', phone:'+992 90 987 65 43', address:'',
    items:[{name:'Костюми варзишӣ', qty:1, price:380}], status:'done', comment:'' },
  { id:1033, date:daysAgo(15), name:'Гулнора Исмоилова', phone:'+992 92 111 44 55', address:'кӯч. Фирдавсӣ 3',
    items:[{name:'Зарядкунаки бесим', qty:2, price:120}], status:'done', comment:'' },
  { id:1032, date:daysAgo(22), name:'Рустам Файзуллоев', phone:'+992 93 222 33 44', address:'',
    items:[{name:'Ҷузвдони мактабӣ', qty:1, price:210}], status:'cancel', comment:'Не отвечает на звонки' },
  { id:1031, date:daysAgo(30), name:'Малика Носирова', phone:'+992 98 333 22 11', address:'мкр. 19',
    items:[{name:'Куртаи мардона', qty:1, price:450},{name:'Сумкаи занона', qty:1, price:340}], status:'done', comment:'' },
];

function orderTotal(o){ return o.items.reduce((s,i)=>s+i.qty*i.price,0); }

/* ==========================================================================
   СОСТОЯНИЕ
   ========================================================================== */
let activeDate = 'all';
let activeStatus = 'all';
let searchQuery = '';
const DATE_TABS = [
  {key:'today', label:'Сегодня'},
  {key:'week',  label:'7 дней'},
  {key:'month', label:'30 дней'},
  {key:'all',   label:'Все'},
];

function inDateRange(order, key){
  const diffDays = Math.floor((new Date() - order.date) / 86400000);
  if(key==='today') return diffDays===0;
  if(key==='week') return diffDays<=7;
  if(key==='month') return diffDays<=30;
  return true;
}

function fmtDate(d){
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
}

function renderDateTabs(){
  const bar = document.getElementById('dateTabs');
  bar.innerHTML = DATE_TABS.map(t=>
    `<button class="${t.key===activeDate?'active':''}" onclick="setDateFilter('${t.key}')">${t.label}</button>`
  ).join('');
}
function setDateFilter(k){ activeDate=k; renderDateTabs(); renderAll(); }

function getFiltered(){
  return MOCK_ORDERS.filter(o=>{
    if(!inDateRange(o, activeDate)) return false;
    if(activeStatus!=='all' && o.status!==activeStatus) return false;
    if(searchQuery){
      const q = searchQuery.toLowerCase();
      if(!o.name.toLowerCase().includes(q) && !o.phone.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>b.date-a.date);
}

function renderStats(list){
  const active = list.filter(o=>o.status!=='cancel');
  const sum = active.reduce((s,o)=>s+orderTotal(o),0);
  document.getElementById('statCount').textContent = list.length;
  document.getElementById('statSum').textContent = sum + ' смн';
  document.getElementById('statNew').textContent = list.filter(o=>o.status==='new').length;
  document.getElementById('statAvg').textContent = (active.length ? Math.round(sum/active.length) : 0) + ' смн';
}

function renderTable(list){
  const body = document.getElementById('ordersBody');
  document.getElementById('filtersCount').textContent = `${list.length} заказ(ов)`;
  if(list.length===0){
    body.innerHTML = `<tr class="empty-row"><td colspan="7">Заказов не найдено</td></tr>`;
    return;
  }
  body.innerHTML = list.map(o=>{
    const itemsText = o.items.map(i=>`${i.name} ×${i.qty}`).join(', ');
    return `
      <tr onclick="openOrder(${o.id})">
        <td data-label="№"><span class="order-id">#${o.id}</span></td>
        <td data-label="Дата">${fmtDate(o.date)}</td>
        <td data-label="Клиент">${o.name}</td>
        <td data-label="Телефон">${o.phone}</td>
        <td data-label="Товары"><span class="order-items">${itemsText}</span></td>
        <td data-label="Сумма"><span class="order-sum">${orderTotal(o)} смн</span></td>
        <td data-label="Статус"><span class="badge-status ${STATUS_CLASS[o.status]}">${STATUS_LABEL[o.status]}</span></td>
      </tr>`;
  }).join('');
}

function renderAll(){
  const list = getFiltered();
  renderStats(list);
  renderTable(list);
}

/* ---------- order modal ---------- */
function openOrder(id){
  const o = MOCK_ORDERS.find(x=>x.id===id);
  if(!o) return;
  const itemsHtml = o.items.map(i=>`
    <div class="om-item"><span>${i.name} ×${i.qty}</span><span>${i.qty*i.price} смн</span></div>
  `).join('');
  const statusBtns = Object.keys(STATUS_LABEL).map(s=>
    `<button class="om-status-btn ${s===o.status?'active st-'+s:''}" onclick="setOrderStatus(${o.id},'${s}')">${STATUS_LABEL[s]}</button>`
  ).join('');

  document.getElementById('orderModal').innerHTML = `
    <div class="om-head">
      <h3>Заказ #${o.id}</h3>
      <button class="om-close" onclick="closeOrder()">✕</button>
    </div>
    <div class="om-date">${fmtDate(o.date)}</div>

    <div class="om-section">
      <div class="om-label">Клиент</div>
      <div class="om-line">${o.name}</div>
      <div class="om-line">${o.phone}</div>
      ${o.address ? `<div class="om-line">${o.address}</div>` : ''}
      ${o.comment ? `<div class="om-line" style="color:#6b655a;margin-top:6px">💬 ${o.comment}</div>` : ''}
    </div>

    <div class="om-section">
      <div class="om-label">Товары</div>
      <div class="om-items">${itemsHtml}</div>
      <div class="om-total"><span>Итого</span><span>${orderTotal(o)} смн</span></div>
    </div>

    <div class="om-section">
      <div class="om-label">Статус заказа</div>
      <div class="om-status-row">${statusBtns}</div>
    </div>

    <div class="om-hint">Это тестовые данные — изменение статуса видно только в этом сеансе браузера и не сохраняется. Когда подключим реальный источник данных, изменения будут сохраняться по-настоящему.</div>
  `;
  document.getElementById('orderModalOverlay').classList.add('show');
}
function closeOrder(){ document.getElementById('orderModalOverlay').classList.remove('show'); }
function setOrderStatus(id, status){
  const o = MOCK_ORDERS.find(x=>x.id===id);
  if(!o) return;
  o.status = status;
  openOrder(id);
  renderAll();
}

/* ---------- login gate ---------- */
function checkPassword(){
  const val = document.getElementById('gatePassword').value;
  if(val === ADMIN_PASSWORD){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').classList.add('show');
  } else {
    document.getElementById('gateErr').style.display = 'block';
  }
}
function logout(){
  document.getElementById('app').classList.remove('show');
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('gatePassword').value = '';
  document.getElementById('gateErr').style.display = 'none';
}

/* ---------- init ---------- */
document.getElementById('searchInput').addEventListener('input', e=>{ searchQuery = e.target.value.trim(); renderAll(); });
document.getElementById('statusSelect').addEventListener('change', e=>{ activeStatus = e.target.value; renderAll(); });
document.getElementById('orderModalOverlay').addEventListener('click', e=>{ if(e.target.id==='orderModalOverlay') closeOrder(); });
renderDateTabs();
renderAll();
</script>
</body>
</html>
