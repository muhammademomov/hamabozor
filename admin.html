<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ХАМАБОЗОР — Админ панель</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;-webkit-font-smoothing:antialiased}
a{color:#16A34A;text-decoration:none}
a:hover{color:#15803D;text-decoration:underline}
input::placeholder,textarea::placeholder{color:#a1a1a6}
input,select,textarea{font-family:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:#16A34A !important;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}
.btn{cursor:pointer;border:none;border-radius:980px;font-weight:600;font-size:13px;padding:9px 18px}
.btn-primary{background:#16A34A;color:#fff}
.btn-secondary{background:#f5f5f7;color:#1d1d1f;border:1px solid #d2d2d7}
.btn-danger{background:#fff1f0;color:#ff3b30;border:1px solid #ffd6d3}
.field{width:100%;padding:10px 12px;border:1px solid #d2d2d7;border-radius:10px;font-size:14px;background:#fbfbfd}
.card{background:#fff;border-radius:16px;border:1px solid #e5e5e7;padding:20px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:11.5px;font-weight:600;color:#6e6e73;text-transform:uppercase;border-bottom:1px solid #e5e5e7}
td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid #f0f0f2}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:20px;padding:28px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.modal h3{margin:0;font-size:18px;font-weight:600}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:#86868b}
.hidden{display:none !important}
.nav-btn{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;border:none;cursor:pointer;background:transparent;color:#3a3a3c}
.nav-btn.active{background:#16A34A;color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:12px 22px;border-radius:980px;font-size:13.5px;font-weight:500;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:980px}
.pm-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pm-chip{padding:6px 12px;border-radius:980px;font-size:12.5px;font-weight:600;border:1px solid #d2d2d7;background:#fff;color:#3a3a3c;cursor:pointer}
.pm-chip.active{background:#16A34A;border-color:#16A34A;color:#fff}
.pm-chip-add{display:flex;gap:8px;margin-top:8px}
.pm-chip-add .field{flex:1}
.pm-chip-add .btn{white-space:nowrap}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate" style="position:fixed;inset:0;background:linear-gradient(180deg,#f7f7f9,#e8e8ed);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1">
  <div style="background:#fff;border-radius:24px;padding:44px 40px;max-width:380px;width:100%;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.12)">
    <div style="width:56px;height:56px;border-radius:16px;background:#1d1d1f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;margin:0 auto 20px">Х</div>
    <h1 style="font-size:22px;font-weight:600;margin:0 0 6px;color:#1d1d1f;letter-spacing:-.01em">Панель управления</h1>
    <p style="font-size:14px;color:#6e6e73;margin:0 0 28px">ХАМАБОЗОР · вход для администратора</p>
    <input id="loginEmail" type="email" placeholder="Email" class="field" style="margin-bottom:10px">
    <input id="loginPassword" type="password" placeholder="Пароль" class="field">
    <button class="btn btn-primary" style="width:100%;margin-top:16px;padding:13px" onclick="login()">Войти</button>
    <div id="loginError" style="color:#ff3b30;font-size:12.5px;margin-top:12px"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden" style="display:flex;min-height:100vh">
  <aside style="width:248px;flex-shrink:0;background:#fbfbfd;border-right:1px solid #e5e5e7;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto">
    <div style="padding:24px 20px 18px;display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:10px;background:#1d1d1f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0">Х</div>
      <div><div style="font-weight:600;font-size:14.5px;letter-spacing:-.01em">ХАМАБОЗОР</div><div style="font-size:11px;color:#86868b;font-weight:500">Админ панель</div></div>
    </div>
    <nav id="navList" style="flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:1px"></nav>
    <div style="padding:14px 16px;border-top:1px solid #e5e5e7;display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:50%;background:#16A34A;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">А</div>
      <div style="flex:1;font-size:12.5px;font-weight:600">Администратор</div>
      <button onclick="logout()" style="background:none;border:none;font-size:12px;color:#16A34A;cursor:pointer;font-weight:600">Выйти</button>
    </div>
  </aside>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header style="height:64px;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid #e5e5e7;display:flex;align-items:center;gap:14px;padding:0 32px;position:sticky;top:0;z-index:10">
      <div id="sectionTitle" style="font-size:17px;font-weight:600"></div>
      <button class="btn btn-secondary" style="margin-left:auto" onclick="loadSection(state.section)">↻ Обновить</button>
    </header>
    <div id="content" style="flex:1;overflow-y:auto;padding:32px 36px 90px"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast hidden"></div>

<script>
const TOKEN_KEY='hamabozor_admin_token';
const STATUS_LABEL={new:'Новый',progress:'В обработке',done:'Выполнен',cancel:'Отменён'};
const STATUS_COLOR={new:'#ff9500',progress:'#16A34A',done:'#34c759',cancel:'#ff3b30'};
const CAT_LABEL={electronics:'Электроника',clothing:'Одежда',bags:'Сумки'};
const NAV=[
  {label:'Главное',items:[['dashboard','Дашборд'],['orders','Заказы'],['products','Товары'],['hr','Кадры'],['logistics','Курьеры']]},
  {label:'Инструменты',items:[['marketing','Маркетинг'],['finance','Финансы'],['purchasing','Закупки'],['partners','Партнёры'],['banners','Баннеры']]},
];
const TITLES={dashboard:'Дашборд',orders:'Заказы',products:'Товары',hr:'Кадры',logistics:'Курьеры',marketing:'Маркетинг',finance:'Финансы',purchasing:'Закупки',partners:'Партнёры',banners:'Баннеры'};
function money(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ru-RU')+' смн'; }
function fmtDate(s){ if(!s) return '—'; try{ return new Date(s).toLocaleDateString('ru-RU'); }catch(e){ return s; } }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- известные цвета/размеры (запоминаются для будущих товаров) ---------------- */
const PM_KNOWN_KEY = { colors:'hamabozor_known_colors', sizes:'hamabozor_known_sizes' };
const PM_DEFAULTS = {
  colors: ['Чёрный','Белый','Серый','Синий','Небесный','Красный','Зелёный','Коричневый','Розовый','Оранжевый'],
  sizes: ['S','M','L','XL','13-14 дюймов','15-16 дюймов']
};
function pmGetKnown(kind){
  let list = [];
  try{ list = JSON.parse(localStorage.getItem(PM_KNOWN_KEY[kind])||'null') || []; }catch(e){}
  if(!list.length) list = [...PM_DEFAULTS[kind]];
  // подмешиваем значения, которые реально уже используются в товарах (на случай если раньше добавляли не через это поле)
  (cache.products||[]).forEach(p=>{
    const raw = kind==='colors'?p.colors:p.sizes;
    (raw||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(v=>{ if(!list.includes(v)) list.push(v); });
  });
  return list;
}
function pmSaveKnown(kind, list){
  localStorage.setItem(PM_KNOWN_KEY[kind], JSON.stringify(list));
}
function pmCurrentValues(kind){
  const el = document.getElementById('pm_'+kind);
  return (el ? el.value : '').split(',').map(s=>s.trim()).filter(Boolean);
}
function renderPmChips(kind){
  const known = pmGetKnown(kind);
  const current = pmCurrentValues(kind);
  const box = document.getElementById('pm_'+kind+'_chips');
  if(!box) return;
  box.innerHTML = known.map(v=>`<button type="button" class="pm-chip ${current.includes(v)?'active':''}" onclick="pmToggleChip('${kind}','${v.replace(/'/g,"\\'")}')">${esc(v)}</button>`).join('');
}
function pmToggleChip(kind, value){
  let current = pmCurrentValues(kind);
  if(current.includes(value)) current = current.filter(v=>v!==value);
  else current.push(value);
  document.getElementById('pm_'+kind).value = current.join(', ');
  renderPmChips(kind);
}
function pmAddKnownValue(kind){
  const input = document.getElementById('pm_'+kind+'_new');
  const value = (input.value||'').trim();
  if(!value) return;
  const known = pmGetKnown(kind);
  if(!known.includes(value)){ known.push(value); pmSaveKnown(kind, known); }
  input.value = '';
  // сразу добавляем и в сам товар
  let current = pmCurrentValues(kind);
  if(!current.includes(value)) current.push(value);
  document.getElementById('pm_'+kind).value = current.join(', ');
  renderPmChips(kind);
}
function dashStatCard(icon, iconBg, label, value){
  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:12px;font-weight:600;color:#6e6e73;text-transform:uppercase">${label}</div>
      <div style="width:30px;height:30px;border-radius:9px;background:${iconBg};display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">${icon}</div>
    </div>
    <div style="font-size:26px;font-weight:600">${value}</div>
  </div>`;
}

const state={ token: localStorage.getItem(TOKEN_KEY)||null, section:'orders', orderSearch:'', orderStatus:'all', productSearch:'', productCat:'all', dashPeriod:'today', financePeriod:'today', financeTab:'overview', marketingTab:'promo' };
let cache={};

function flash(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.add('hidden'),3000); }

async function apiFetch(path, opts={}){
  const res=await fetch(path,{...opts, headers:{'Content-Type':'application/json', ...(state.token?{Authorization:'Bearer '+state.token}:{}), ...(opts.headers||{})}});
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok) throw new Error((data&&data.error)||'Ошибка запроса');
  return data;
}

function login(){
  const email=document.getElementById('loginEmail').value, password=document.getElementById('loginPassword').value;
  document.getElementById('loginError').textContent='';
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})})
    .then(async res=>{ const data=await res.json(); if(!res.ok) throw new Error(data.error||'Не удалось войти'); return data; })
    .then(data=>{ localStorage.setItem(TOKEN_KEY,data.token); state.token=data.token; enterApp(); })
    .catch(e=>{ document.getElementById('loginError').textContent=e.message; });
}
function logout(){ localStorage.removeItem(TOKEN_KEY); state.token=null; document.getElementById('app').classList.add('hidden'); document.getElementById('gate').classList.remove('hidden'); }
document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });

function enterApp(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderNav();
  goSection(state.section);
}
if(state.token) enterApp();

function renderNav(){
  const el=document.getElementById('navList');
  el.innerHTML = NAV.map(g=>`<div style="font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#a1a1a6;padding:16px 10px 6px">${g.label}</div>` +
    g.items.map(([id,label])=>`<button class="nav-btn ${state.section===id?'active':''}" onclick="goSection('${id}')">${label}</button>`).join('')
  ).join('') + `<a href="index.html" target="_blank" style="display:block;padding:10px;border-radius:10px;font-size:13.5px;font-weight:500;color:#6e6e73;margin-top:10px">Магазин ↗</a>`;
}
function goSection(id){ state.section=id; document.getElementById('sectionTitle').textContent=TITLES[id]||''; renderNav(); loadSection(id); }

function loadSection(section){
  const c=document.getElementById('content');
  c.innerHTML='<div style="color:#86868b;padding:40px;text-align:center">Загрузка…</div>';
  if(section==='dashboard') loadDashboard();
  else if(section==='orders') loadOrders();
  else if(section==='products') loadProducts();
  else if(section==='logistics') loadCouriers();
  else if(section==='partners') loadPartners();
  else if(section==='purchasing') loadPurchasing();
  else if(section==='finance') loadFinance();
  else if(section==='marketing') loadMarketingTab(state.marketingTab);
  else if(section==='hr') loadEmployees();
  else if(section==='banners') loadBanners();
}

/* ---------------- DASHBOARD ---------------- */
function loadDashboard(){
  apiFetch('/api/dashboard/summary?period='+state.dashPeriod).then(d=>renderDashboard(d)).catch(e=>flash(e.message));
}
function setDashPeriod(p){ state.dashPeriod=p; loadDashboard(); }
function renderDashboard(d){
  const bars=(d.chart&&d.chart.by_day)||[]; const maxV=Math.max(1,...bars.map(b=>b.sales));
  const top=(d.products&&d.products.top_selling)||[]; const worst=(d.products&&d.products.worst_selling)||[]; const viewed=(d.products&&d.products.top_viewed)||[];
  const sources=d.order_sources||[]; const roi=(d.marketing?d.marketing.roi_pct:0);
  const cust=d.customers||{repeat_rate:0,vip_customers:0,avg_ltv:0};
  document.getElementById('content').innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:24px">
      ${['today','week','month'].map(p=>`<button class="btn ${state.dashPeriod===p?'btn-primary':'btn-secondary'}" onclick="setDashPeriod('${p}')">${p==='today'?'Сегодня':p==='week'?'7 дней':'Месяц'}</button>`).join('')}
    </div>
    <div class="grid4" style="margin-bottom:24px">
      ${dashStatCard('💰','#E7F6EC','Выручка', money(d.revenue))}
      ${dashStatCard('🛒','#EEE9FE','Заказов', d.orders_count)}
      ${dashStatCard('💳','#E1F7F3','Средний чек', money(d.avg_check))}
      ${dashStatCard('📈','#FBEDD8','Трафик · конверсия', d.traffic+' · '+d.conversion+'%')}
    </div>
    <div class="card" style="margin-bottom:20px">
      <div style="font-size:15px;font-weight:600;margin-bottom:16px">Продажи по дням</div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:120px">
        ${bars.map(b=>`<div title="${esc(b.date)}: ${money(b.sales)}" style="flex:1;background:#16A34A;border-radius:6px 6px 0 0;min-height:3px;height:${Math.max(3,Math.round((b.sales/maxV)*100))}%"></div>`).join('')}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card"><div style="font-size:15px;font-weight:600;margin-bottom:14px">🔝 Топ продаж</div>
        ${top.length? top.map(p=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f2;font-size:13.5px"><span>${esc(p.name)}</span><b>${p.qty} шт · ${money(p.revenue)}</b></div>`).join('') : '<div style="color:#86868b;font-size:13px">Пока нет продаж за период.</div>'}
      </div>
      <div class="card"><div style="font-size:15px;font-weight:600;margin-bottom:14px">👥 Клиенты</div>
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f2;font-size:13.5px"><span>Повторные</span><b>${cust.repeat_rate}%</b></div>
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f2;font-size:13.5px"><span>Средний LTV</span><b>${money(cust.avg_ltv)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px"><span>VIP-клиентов</span><b>${cust.vip_customers}</b></div>
      </div>
    </div>
    <div class="grid3" style="margin-top:20px">
      <div class="card"><div style="font-size:15px;font-weight:600;margin-bottom:14px">📉 Низкие продажи</div>
        ${worst.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f2;font-size:13px;color:#c0392b"><span>${esc(p.name)}</span><b>${p.qty} шт</b></div>`).join('')}
      </div>
      <div class="card"><div style="font-size:15px;font-weight:600;margin-bottom:14px">👁 Больше всего просмотров</div>
        ${viewed.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f2;font-size:13px"><span>${esc(p.name)}</span><b>${p.views||0}</b></div>`).join('')}
      </div>
      <div class="card"><div style="font-size:15px;font-weight:600;margin-bottom:14px">📡 Источники заказов</div>
        ${sources.map(o=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f2;font-size:13px"><span>${esc(o.channel||'direct')}</span><b>${o.count}</b></div>`).join('')}
        <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;margin-top:6px"><span>📣 Маркетинг ROI</span><b>${roi}%</b></div>
      </div>
    </div>`;
}

/* ---------------- ORDERS ---------------- */
function loadOrders(){
  Promise.all([apiFetch('/api/orders'), apiFetch('/api/couriers').catch(()=>[])])
    .then(([orders,couriers])=>{ cache.orders=orders; cache.couriers=couriers; renderOrders(); })
    .catch(e=>flash(e.message));
}
function updateOrderStatus(id,status){ apiFetch('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({status})}).then(loadOrders).catch(e=>flash(e.message)); }
function assignCourier(orderId, courierId){
  if(!courierId){ return; }
  apiFetch('/api/orders/'+orderId+'/assign-courier',{method:'POST',body:JSON.stringify({courier_id:Number(courierId)})})
    .then(()=>{ flash('Курьер назначен'); loadOrders(); })
    .catch(e=>flash(e.message));
}
function renderOrders(){
  const orders=cache.orders||[];
  const q=(state.orderSearch||'').toLowerCase();
  const filtered=orders.filter(o=>{
    const matchQ=!q||(o.customer_name||'').toLowerCase().includes(q)||(o.customer_phone||'').includes(q);
    const matchS=state.orderStatus==='all'||o.status===state.orderStatus;
    return matchQ&&matchS;
  });
  const nonCancel=orders.filter(o=>o.status!=='cancel');
  const sum=nonCancel.reduce((a,o)=>a+(Number(o.total)||0),0);
  document.getElementById('content').innerHTML = `
    <div class="grid4" style="margin-bottom:20px">
      <div class="card"><div style="font-size:12px;color:#6e6e73;font-weight:600;text-transform:uppercase">Заказов</div><div style="font-size:24px;font-weight:600;margin-top:6px">${orders.length}</div></div>
      <div class="card"><div style="font-size:12px;color:#6e6e73;font-weight:600;text-transform:uppercase">Сумма</div><div style="font-size:24px;font-weight:600;margin-top:6px">${money(sum)}</div></div>
      <div class="card"><div style="font-size:12px;color:#6e6e73;font-weight:600;text-transform:uppercase">Новые</div><div style="font-size:24px;font-weight:600;margin-top:6px;color:#ff3b30">${orders.filter(o=>o.status==='new').length}</div></div>
      <div class="card"><div style="font-size:12px;color:#6e6e73;font-weight:600;text-transform:uppercase">Средний чек</div><div style="font-size:24px;font-weight:600;margin-top:6px">${money(nonCancel.length?sum/nonCancel.length:0)}</div></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
      <input class="field" style="flex:1;min-width:220px;max-width:320px" placeholder="Поиск по имени или телефону..." value="${esc(state.orderSearch)}" oninput="state.orderSearch=this.value; renderOrders()">
      <select class="field" style="width:auto" onchange="state.orderStatus=this.value; renderOrders()">
        <option value="all">Все статусы</option><option value="new">Новый</option><option value="progress">В обработке</option><option value="done">Выполнен</option><option value="cancel">Отменён</option>
      </select>

function openRefundModal(orderId){
  const o = (cache.orders||[]).find(x=>x.id===orderId);

  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop"><div class="modal" style="max-width:380px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3>Возврат по заказу #${o.id}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>

function saveRefund(orderId){
  const amount = Number(document.getElementById('rf_amount').value||0);
  const reason = document.getElementById('rf_reason').value;
  if(amount<=0){ document.getElementById('rfError').textContent='Укажите сумму возврата'; return; }
  apiFetch(`/api/orders/${orderId}/refund`,{method:'POST',body:JSON.stringify({amount,reason})})
    .then(()=>{ closeModal(); flash('Возврат оформлен'); loadOrders(); })
    .catch(e=>document.getElementById('rfError').textContent=e.message);

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function saveProduct(){
  const name_ru=document.getElementById('pm_name_ru').value, price=document.getElementById('pm_price').value;
  if(!name_ru||price===''){ document.getElementById('pmError').textContent='Укажите название и цену'; return; }
  const img=document.getElementById('pm_image_preview');
  const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const numOrNull = id => { const s = v(id); return s===''?null:Number(s); };
  const name_tj = v('pm_name_tj');
  // запоминаем любые новые цвета/размеры, вписанные вручную в текстовое поле, для будущих товаров
  ['colors','sizes'].forEach(kind=>{
    const used = pmCurrentValues(kind);
    const known = pmGetKnown(kind);
    let changed = false;
    used.forEach(val=>{ if(!known.includes(val)){ known.push(val); changed = true; } });
    if(changed) pmSaveKnown(kind, known);
  });
  const payload={
    name_ru, name_tj: name_tj || name_ru,
    subtitle_ru: v('pm_subtitle_ru'), subtitle_tj: v('pm_subtitle_tj'),
    cat:document.getElementById('pm_cat').value, tag:document.getElementById('pm_tag').value,
    price:Number(price), old_price:numOrNull('pm_old_price'),
    bundle2_price:numOrNull('pm_bundle2'), bundle3_price:numOrNull('pm_bundle3'), bundle4_price:numOrNull('pm_bundle4'),
    cost_price:numOrNull('pm_cost_price'),
    stock:numOrNull('pm_stock'),
    colors:v('pm_colors'), sizes:v('pm_sizes'),
    desc_ru:v('pm_desc_ru'), desc_tj:v('pm_desc_tj'),
    features_ru:v('pm_features_ru'), features_tj:v('pm_features_tj'),
    delivery_ru:v('pm_delivery_ru'), delivery_tj:v('pm_delivery_tj'),
    warranty_ru:v('pm_warranty_ru'), warranty_tj:v('pm_warranty_tj'),
    seller_name:v('pm_seller_name'), partner_id:v('pm_partner_id')?Number(v('pm_partner_id')):null,
    received_at:v('pm_received_at')||null,
    image_data: img.style.display!=='none'?img.src:null, extra_images:pmExtraImages };
  const req = pmEditId ? apiFetch('/api/products/'+pmEditId,{method:'PUT',body:JSON.stringify(payload)}) : apiFetch('/api/products',{method:'POST',body:JSON.stringify(payload)});
  req.then(()=>{ closeModal(); loadProducts(); flash('Товар сохранён'); }).catch(e=>{ document.getElementById('pmError').textContent=e.message; });
}

function deleteProduct(id,name){ if(!confirm('Удалить товар «'+name+'»?')) return; apiFetch('/api/products/'+id,{method:'DELETE'}).then(loadProducts).catch(e=>flash(e.message)); }

function comparePartnerMethods(id){
  const from = document.getElementById('cmp_from').value;
  const to = document.getElementById('cmp_to').value;
  if(!from || !to){ document.getElementById('cmp_result').innerHTML = '<p style="color:#ff3b30;font-size:12.5px">Укажите обе даты</p>'; return; }
  document.getElementById('cmp_result').innerHTML = '<p style="font-size:12.5px;color:#86868b">Считаю...</p>';
  apiFetch(`/api/partners/${id}/compare?from=${from}&to=${to}`).then(c=>{
    const rows = [
      ['По опту (себестоимость проданного)', c.by_wholesale, c.current_basis==='wholesale'],
      [`По валовой прибыли (${c.commission_percent}% от маржи)`, c.by_gross, c.current_basis==='gross'],
      [`По чистой прибыли (${c.commission_percent}% от маржи минус доставка)`, c.by_net, c.current_basis==='net'],
    ];
    document.getElementById('cmp_result').innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;font-size:12px">
        <div style="background:#f5f5f7;border-radius:10px;padding:10px"><div style="color:#6e6e73">Выручка</div><b>${money(c.revenue)}</b></div>
        <div style="background:#f5f5f7;border-radius:10px;padding:10px"><div style="color:#6e6e73">Себестоимость</div><b>${money(c.cost)}</b></div>
        <div style="background:#f5f5f7;border-radius:10px;padding:10px"><div style="color:#6e6e73">Маржа</div><b>${money(c.margin)}</b></div>
        <div style="background:#f5f5f7;border-radius:10px;padding:10px"><div style="color:#6e6e73">Доставка (этих заказов)</div><b>${money(c.delivery_cost)}</b></div>
        <div style="background:#f5f5f7;border-radius:10px;padding:10px;grid-column:span 2"><div style="color:#6e6e73">Общие расходы бизнеса за период (справочно, в расчёт не входят)</div><b>${money(c.general_expenses_period)}</b></div>
      </div>
      ${rows.map(([label,val,isCurrent])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:6px;background:${isCurrent?'#e8f8ec':'#fff'};border:1px solid ${isCurrent?'#16A34A':'#e5e5e7'}">
          <span style="font-size:12.5px">${label} ${isCurrent?'<b style=\"color:#16A34A\">← сейчас так настроено</b>':''}</span>
          <b style="font-size:15px">${money(val)}</b>
        </div>`).join('')}
    `;
  }).catch(e=>{ document.getElementById('cmp_result').innerHTML = `<p style="color:#ff3b30;font-size:12.5px">${e.message}</p>`; });
}
function addPartnerExpense(id){ const title=document.getElementById('pe_title').value, amount=document.getElementById('pe_amount').value; if(!title||!amount) return; apiFetch('/api/partners/'+id+'/expenses',{method:'POST',body:JSON.stringify({title,amount:Number(amount),partner_share_percent:100})}).then(()=>openPartnerDetail(id)).catch(e=>flash(e.message)); }

/* ---------------- PURCHASING ---------------- */
function loadPurchasing(){ Promise.all([apiFetch('/api/purchases'), cache.products?Promise.resolve(cache.products):fetch('/api/products?all=1').then(r=>r.json())]).then(([purchases,products])=>{ cache.purchases=purchases; cache.products=products; renderPurchasing(); }).catch(e=>flash(e.message)); }
function renderPurchasing(){
  const purchases=cache.purchases||[], products=cache.products||[];
  const nameById={}; products.forEach(p=>nameById[p.id]=p.name_ru);
  const margins=products.slice(0,12).map(p=>({name:p.name_ru,price:Number(p.price)||0,cost:Number(p.cost_price)||0}));
  document.getElementById('content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:15px;font-weight:600">📈 Маржа по товарам</div>
      <button class="btn btn-primary" onclick="openPurchaseModal()">+ Добавить закупку</button>
    </div>
    <div class="grid3" style="margin-bottom:24px">${margins.map(m=>`
      <div class="card"><b style="font-size:14px">${esc(m.name)}</b>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:#6e6e73;margin-top:8px"><span>Продажа</span><b style="color:#1d1d1f">${money(m.price)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:#6e6e73;margin-top:4px"><span>Себестоимость</span><b style="color:#1d1d1f">${money(m.cost)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:#6e6e73;margin-top:4px"><span>Маржа</span><b style="color:#34c759">${money(m.price-m.cost)}</b></div>
      </div>`).join('')}</div>
    <div style="font-size:15px;font-weight:600;margin-bottom:12px">История закупок</div>
    <div class="card" style="padding:0;overflow:hidden">
      <table><thead><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Дата</th><th>Поставщик</th><th></th></tr></thead>
      <tbody>${purchases.map(pu=>`<tr><td>${esc(nameById[pu.product_id]||('#'+pu.product_id))}</td><td>${pu.qty}</td><td>${money(pu.unit_price)}</td><td>${fmtDate(pu.purchase_date)}</td><td>${esc(pu.supplier||'—')}</td>
        <td><button class="btn btn-danger" style="padding:5px 10px;font-size:11.5px" onclick="deletePurchase(${pu.id})">Удалить</button></td></tr>`).join('')}</tbody></table>
    </div>`;

function openPurchaseModal(){
  const products=cache.products||[];
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop"><div class="modal" style="max-width:420px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3>Новая закупка</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <select id="pu_product_id" class="field"><option value="">Выберите товар...</option>${products.map(p=>`<option value="${p.id}">${esc(p.name_ru)}</option>`).join('')}</select>
      <input id="pu_qty" type="number" class="field" placeholder="Количество">
      <input id="pu_unit_price" type="number" class="field" placeholder="Цена за единицу">
      <input id="pu_purchase_date" type="date" class="field" value="${new Date().toISOString().slice(0,10)}">

function savePurchase(){
  const product_id=document.getElementById('pu_product_id').value, qty=document.getElementById('pu_qty').value, unit_price=document.getElementById('pu_unit_price').value, purchase_date=document.getElementById('pu_purchase_date').value;
  if(!product_id||!qty||unit_price===''||!purchase_date){ document.getElementById('puError').textContent='Заполните товар, количество, цену и дату'; return; }
  apiFetch('/api/purchases',{method:'POST',body:JSON.stringify({product_id:Number(product_id),qty:Number(qty),unit_price:Number(unit_price),purchase_date,supplier:document.getElementById('pu_supplier').value})}).then(()=>{ closeModal(); loadPurchasing(); }).catch(e=>document.getElementById('puError').textContent=e.message);
}
function deletePurchase(id){ if(!confirm('Удалить закупку?')) return; apiFetch('/api/purchases/'+id,{method:'DELETE'}).then(loadPurchasing).catch(e=>flash(e.message)); }

/* ---------------- FINANCE ---------------- */
function loadFinance(){
  Promise.all([apiFetch('/api/finance/summary?period='+state.financePeriod), apiFetch('/api/general-expenses'), apiFetch('/api/owner-transactions'), apiFetch('/api/expense-categories').catch(()=>[])])
    .then(([fin,ge,ot,cats])=>{ cache.financeData=fin; cache.generalExpenses=ge; cache.ownerTx=ot; cache.expenseCategories=cats;
      if(state.financeTab==='balance') apiFetch('/api/finance/balance').then(b=>{ cache.financeBalance=b; renderFinance(); }).catch(()=>renderFinance());
      else renderFinance();
    }).catch(e=>flash(e.message));
  apiFetch('/api/finance/meta-ads-spend?period='+state.financePeriod).then(m=>{ cache.metaAds=m; renderFinance(); }).catch(()=>{});
}
function setFinancePeriod(p){ state.financePeriod=p; loadFinance(); }
function setFinanceTab(t){
  state.financeTab=t;
  if(t==='balance'&&!cache.financeBalance) loadFinance();
  else if(t==='monthly') loadMonthlyFinance();
  else renderFinance();
}
function loadMonthlyFinance(months){
  const n = months || state.financeMonths || 6;
  state.financeMonths = n;
  document.getElementById('content') && renderFinance(); // сразу покажем "Загрузка..."
  apiFetch('/api/finance/monthly?months='+n).then(d=>{ cache.financeMonthly=d.months; renderFinance(); }).catch(e=>flash(e.message));
}
function renderFinance(){
  const fin=cache.financeData, bal=cache.financeBalance, ge=cache.generalExpenses||[], ot=cache.ownerTx||[];

  const tabs=[['overview','Обзор'],['pnl','ОПиУ'],['cashflow','ОДДС'],['balance','Баланс'],['monthly','По месяцам']].map(([id,label])=>`<button onclick="setFinanceTab('${id}')" style="background:none;border:none;padding:10px 2px;font-size:14px;font-weight:600;cursor:pointer;color:${state.financeTab===id?'#16A34A':'#6e6e73'};border-bottom:2px solid ${state.financeTab===id?'#16A34A':'transparent'}">${label}</button>`).join('');

        ${ge.map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f2;font-size:13px">

          <span style="display:flex;align-items:center;gap:8px"><b>${money(e.amount)}</b><button onclick="deleteExpense(${e.id})" style="background:none;border:none;color:#ff3b30;cursor:pointer">✕</button></span>
        </div>`).join('')}
      </div>
      <div class="card">
        <b style="font-size:14.5px">🏦 Взносы и изъятия</b>
        <div style="display:flex;gap:8px;margin:12px 0">
          <button class="btn btn-primary" style="flex:1" onclick="openOwnerTxModal('contribution')">+ Внёс</button>
          <button class="btn btn-secondary" style="flex:1" onclick="openOwnerTxModal('withdrawal')">− Забрал</button>
        </div>
        ${ot.map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f2;font-size:13px"><span>${t.type==='contribution'?'Внёс':'Забрал'} <span style="color:#a1a1a6">· ${fmtDate(t.transaction_date)}</span></span><span style="display:flex;align-items:center;gap:8px"><b>${money(t.amount)}</b><button onclick="deleteOwnerTx(${t.id})" style="background:none;border:none;color:#ff3b30;cursor:pointer">✕</button></span></div>`).join('')}

      <div style="font-size:13px;color:#6e6e73">📣 <b>Meta Ads не подключён:</b> ${esc(m.message||'проверьте META_ACCESS_TOKEN и META_AD_ACCOUNT_ID в Railway')}</div>
    </div>`;

  const campaigns = (m.by_campaign||[]).filter(c=>c.spend>0);

    <div style="display:flex;justify-content:space-between;align-items:center">

        <div style="font-size:11.5px;color:#16A34A;margin-top:4px;font-weight:600">✓ уже учтено в «Итого расходы» и «Чистая прибыль» ниже</div>
      </div>
      <div style="width:34px;height:34px;border-radius:10px;background:#EEE9FE;display:flex;align-items:center;justify-content:center;font-size:16px">📣</div>
    </div>
    ${campaigns.length ? `<div style="margin-top:14px;border-top:1px solid #f0f0f2;padding-top:10px">
      ${campaigns.map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span style="color:#3a3a3c">${esc(c.name)}</span><b>${money(c.spend)}</b></div>`).join('')}

function onExpenseCategoryChange(){
  const sel = document.getElementById('ex_category');
  if(sel.value === '__new__'){
    const name = prompt('Название новой категории:');
    if(name){
      apiFetch('/api/expense-categories',{method:'POST',body:JSON.stringify({name})}).then(()=>{
        apiFetch('/api/expense-categories').then(cats=>{ cache.expenseCategories=cats; openExpenseModal(); document.getElementById('ex_category').value=name; onExpenseCategoryChange(); });
      }).catch(e=>flash(e.message));
    } else { sel.value=''; }
    return;
  }
  const cats = cache.expenseCategories||[];
  const cat = cats.find(c=>c.name===sel.value);
  const subSel = document.getElementById('ex_subcategory');
  const subs = (cat&&cat.subcategories)||[];
  subSel.innerHTML = '<option value="">—</option>' + subs.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('') + '<option value="__new__">+ Новая подкатегория...</option>';
  subSel.onchange = () => {
    if(subSel.value==='__new__'){
      const name = prompt('Название новой подкатегории:');
      if(name && cat){
        apiFetch('/api/expense-categories',{method:'POST',body:JSON.stringify({name,parent_id:cat.id})}).then(()=>{
          apiFetch('/api/expense-categories').then(cs=>{ cache.expenseCategories=cs; });
        }).catch(e=>flash(e.message));
        const opt = document.createElement('option'); opt.value=name; opt.textContent=name; opt.selected=true;
        subSel.insertBefore(opt, subSel.lastElementChild);
      } else { subSel.value=''; }
    }
  };
}
function saveExpense(){
  const title=document.getElementById('ex_title').value, amount=document.getElementById('ex_amount').value, expense_date=document.getElementById('ex_date').value;
  if(!title||!amount||!expense_date){ document.getElementById('exError').textContent='Заполните название, сумму и дату'; return; }
  const category = document.getElementById('ex_category').value;
  apiFetch('/api/general-expenses',{method:'POST',body:JSON.stringify({
    title, category: category==='__new__'?'':category, subcategory: document.getElementById('ex_subcategory').value,
    amount:Number(amount), expense_date,
    payment_method: document.getElementById('ex_payment_method').value,
    status: document.getElementById('ex_status').value,
    responsible: document.getElementById('ex_responsible').value,
    note: document.getElementById('ex_note').value,
  })}).then(()=>{ closeModal(); loadFinance(); }).catch(e=>document.getElementById('exError').textContent=e.message);
}
function deleteExpense(id){ apiFetch('/api/general-expenses/'+id,{method:'DELETE'}).then(loadFinance).catch(e=>flash(e.message)); }
function openOwnerTxModal(type){
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop"><div class="modal" style="max-width:380px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3>${type==='contribution'?'Внести в бизнес':'Забрать из бизнеса'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input id="ot_amount" type="number" class="field" placeholder="Сумма">
      <input id="ot_date" type="date" class="field" value="${new Date().toISOString().slice(0,10)}">
      <input id="ot_note" class="field" placeholder="Заметка">
    </div>
    <div id="otError" style="color:#ff3b30;font-size:12.5px;margin-top:12px"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:16px;padding:12px" onclick="saveOwnerTx('${type}')">Сохранить</button>
  </div></div>`;
}
function saveOwnerTx(type){
  const amount=document.getElementById('ot_amount').value, transaction_date=document.getElementById('ot_date').value;
  if(!amount||!transaction_date){ document.getElementById('otError').textContent='Заполните сумму и дату'; return; }
  apiFetch('/api/owner-transactions',{method:'POST',body:JSON.stringify({type,amount:Number(amount),transaction_date,note:document.getElementById('ot_note').value||null})}).then(()=>{ closeModal(); loadFinance(); }).catch(e=>document.getElementById('otError').textContent=e.message);
}
function deleteOwnerTx(id){ apiFetch('/api/owner-transactions/'+id,{method:'DELETE'}).then(loadFinance).catch(e=>flash(e.message)); }

/* ---------------- MARKETING ---------------- */
function setMarketingTab(t){ state.marketingTab=t; loadMarketingTab(t); }
function loadMarketingTab(t){
  const reqs=[apiFetch('/api/promo-codes')];
  if(t==='campaigns') reqs.push(apiFetch('/api/marketing/campaigns')); else reqs.push(Promise.resolve(cache.campaigns||[]));
  if(t==='bloggers') reqs.push(apiFetch('/api/marketing/bloggers')); else reqs.push(Promise.resolve(cache.bloggers||[]));
  if(t==='audience') reqs.push(apiFetch('/api/marketing/audience')); else reqs.push(Promise.resolve(cache.audience||null));
  Promise.all(reqs).then(([promo,camp,blog,aud])=>{ cache.promoCodes=promo; cache.campaigns=camp; cache.bloggers=blog; cache.audience=aud; renderMarketing(); }).catch(e=>flash(e.message));
}
function renderMarketing(){
  const t=state.marketingTab;
  const tabs=[['promo','Промокоды'],['campaigns','Кампании'],['bloggers','Блогеры'],['audience','Аудитория']].map(([id,label])=>`<button onclick="setMarketingTab('${id}')" style="background:none;border:none;padding:10px 2px;font-size:14px;font-weight:600;cursor:pointer;color:${t===id?'#16A34A':'#6e6e73'};border-bottom:2px solid ${t===id?'#16A34A':'transparent'}">${label}</button>`).join('');
  let body='';
  if(t==='promo'){
    const promo=cache.promoCodes||[];
    body = `<button class="btn btn-primary" style="margin-bottom:14px" onclick="openPromoModal()">+ Промокод</button>
    <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Код</th><th>Скидка</th><th>Исп./выручка</th><th>Статус</th><th></th></tr></thead><tbody>
    ${promo.map(p=>`<tr><td style="font-weight:600">${esc(p.code)}</td><td>${p.discount_type==='percent'?p.discount_value+'%':money(p.discount_value)}</td><td>${p.used_count} · ${money(p.revenue)}</td>
      <td><span class="badge" style="${p.active?'background:#e8f8ec;color:#1a7d3a':'background:#fdeeea;color:#a04326'}">${p.active?'Активен':'Откл.'}</span></td>
      <td style="display:flex;gap:6px"><button class="btn btn-secondary" style="padding:5px 10px;font-size:11.5px" onclick="togglePromo(${p.id},${p.active?0:1})">${p.active?'Откл.':'Вкл.'}</button><button class="btn btn-danger" style="padding:5px 10px;font-size:11.5px" onclick="deletePromo(${p.id})">Удалить</button></td></tr>`).join('')}
    </tbody></table></div>`;
  } else if(t==='campaigns'){
    const camp=cache.campaigns||[];
    body = `<button class="btn btn-primary" style="margin-bottom:14px" onclick="openCampaignModal()">+ Кампания</button>
    <div class="grid3">${camp.map(c=>`<div class="card"><b style="font-size:14px">${esc(c.name)}</b><div style="font-size:12px;color:#6e6e73;margin-top:4px">${esc(c.platform||'—')} · бюджет ${money(c.budget)}</div>
      <div style="font-size:12.5px;margin-top:8px">Заказов: <b>${c.stats?c.stats.orders_count:0}</b> · Выручка: <b>${money(c.stats&&c.stats.revenue)}</b></div>
      <button class="btn btn-danger" style="margin-top:10px;padding:6px 12px;font-size:11.5px" onclick="deleteCampaign(${c.id})">Удалить</button></div>`).join('')}</div>`;
  } else if(t==='bloggers'){
    const blog=cache.bloggers||[];
    body = `<button class="btn btn-primary" style="margin-bottom:14px" onclick="openBloggerModal()">+ Блогер</button>
    <div class="grid3">${blog.map(b=>`<div class="card"><b style="font-size:14px">${esc(b.name)}</b><div style="font-size:12px;color:#6e6e73;margin-top:4px">${esc(b.platform||'—')}</div>
      <div style="font-size:12.5px;margin-top:8px">Причитается: <b>${money(b.stats&&b.stats.owed)}</b></div>
      <button class="btn btn-danger" style="margin-top:10px;padding:6px 12px;font-size:11.5px" onclick="deleteBlogger(${b.id})">Удалить</button></div>`).join('')}</div>`;
  } else if(t==='audience'){
    const a=cache.audience;
    body = a ? `<div class="grid4">
      <div class="card"><div style="font-size:12px;color:#6e6e73;font-weight:600;text-transform:uppercase">Клиентов</div><div style="font-size:22px;font-weight:600;margin-top:6px">${a.total_customers}</div></div>
      <div class="card"><div style="font-size:12px;color:#6e6e73;font-weight:600;text-transform:uppercase">Новых</div><div style="font-size:22px;font-weight:600;margin-top:6px">${a.new_customers}</div></div>
      <div class="card"><div style="font-size:12px;color:#6e6e73;font-weight:600;text-transform:uppercase">Повторных</div><div style="font-size:22px;font-weight:600;margin-top:6px">${a.repeat_rate}%</div></div>
      <div class="card"><div style="font-size:12px;color:#6e6e73;font-weight:600;text-transform:uppercase">Заказов на клиента</div><div style="font-size:22px;font-weight:600;margin-top:6px">${a.avg_orders_per_customer}</div></div>
    </div>` : '';
  }
  document.getElementById('content').innerHTML = `<div style="display:flex;gap:20px;border-bottom:1px solid #e5e5e7;margin-bottom:22px">${tabs}</div>${body}`;
}
function openPromoModal(){
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop"><div class="modal" style="max-width:400px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3>Новый промокод</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input id="pc_code" class="field" placeholder="Код" style="text-transform:uppercase">
      <select id="pc_discount_type" class="field"><option value="percent">Процент</option><option value="fixed">Фикс. сумма</option></select>
      <input id="pc_discount_value" type="number" class="field" placeholder="Размер скидки">
      <input id="pc_usage_limit" type="number" class="field" placeholder="Лимит использований">
    </div>
    <div id="pcError" style="color:#ff3b30;font-size:12.5px;margin-top:12px"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:18px;padding:12px" onclick="savePromo()">Сохранить промокод</button>
  </div></div>`;
}
function savePromo(){
  const code=document.getElementById('pc_code').value, discount_value=document.getElementById('pc_discount_value').value;
  if(!code||!discount_value){ document.getElementById('pcError').textContent='Укажите код и размер скидки'; return; }
  const ul=document.getElementById('pc_usage_limit').value;
  apiFetch('/api/promo-codes',{method:'POST',body:JSON.stringify({code,discount_type:document.getElementById('pc_discount_type').value,discount_value:Number(discount_value),usage_limit:ul?Number(ul):null})}).then(()=>{ closeModal(); loadMarketingTab('promo'); }).catch(e=>document.getElementById('pcError').textContent=e.message);
}
function togglePromo(id,active){ apiFetch('/api/promo-codes/'+id,{method:'PATCH',body:JSON.stringify({active})}).then(()=>loadMarketingTab('promo')).catch(e=>flash(e.message)); }
function deletePromo(id){ if(!confirm('Удалить промокод?')) return; apiFetch('/api/promo-codes/'+id,{method:'DELETE'}).then(()=>loadMarketingTab('promo')).catch(e=>flash(e.message)); }
function openCampaignModal(){
  const promo=cache.promoCodes||[];
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop"><div class="modal" style="max-width:400px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3>Новая кампания</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input id="cp_name" class="field" placeholder="Название"><input id="cp_platform" class="field" placeholder="Платформа">
      <input id="cp_budget" type="number" class="field" placeholder="Бюджет">
      <select id="cp_promo_code_id" class="field"><option value="">Без промокода</option>${promo.map(p=>`<option value="${p.id}">${esc(p.code)}</option>`).join('')}</select>
    </div>
    <div id="cpError" style="color:#ff3b30;font-size:12.5px;margin-top:12px"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:18px;padding:12px" onclick="saveCampaign()">Сохранить кампанию</button>
  </div></div>`;
}
function saveCampaign(){
  const name=document.getElementById('cp_name').value;
  if(!name){ document.getElementById('cpError').textContent='Укажите название'; return; }
  const pid=document.getElementById('cp_promo_code_id').value;
  apiFetch('/api/marketing/campaigns',{method:'POST',body:JSON.stringify({name,platform:document.getElementById('cp_platform').value,budget:Number(document.getElementById('cp_budget').value||0),promo_code_id:pid?Number(pid):null})}).then(()=>{ closeModal(); loadMarketingTab('campaigns'); }).catch(e=>document.getElementById('cpError').textContent=e.message);
}
function deleteCampaign(id){ if(!confirm('Удалить кампанию?')) return; apiFetch('/api/marketing/campaigns/'+id,{method:'DELETE'}).then(()=>loadMarketingTab('campaigns')).catch(e=>flash(e.message)); }

function loadEmployees(){ apiFetch('/api/employees').then(d=>{ cache.employees=d; renderEmployees(); }).catch(e=>flash(e.message)); }
function renderEmployees(){

  document.getElementById('content').innerHTML = `
    <button class="btn btn-primary" style="margin-bottom:16px" onclick="openEmployeeModal()">+ Добавить сотрудника</button>
    <div class="grid3">${emp.map(e=>`
      <div class="card" style="cursor:pointer" onclick="openEmployeeDetail(${e.id})">

          <div style="width:36px;height:36px;border-radius:50%;background:#16A34A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0">${esc((e.first_name||'?').charAt(0).toUpperCase())}</div>
          <div style="flex:1"><b style="font-size:14px">${esc([e.first_name,e.last_name].filter(Boolean).join(' '))}</b><div style="font-size:12px;color:#6e6e73">${esc(e.position||'—')}</div></div>
          <span class="badge" style="${e.active?'background:#e8f8ec;color:#1a7d3a':'background:#fdeeea;color:#a04326'}">${e.active?'Активен':'Уволен'}</span>

function openEmployeeModal(){
  document.getElementById('modalRoot').innerHTML = `

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

      <input id="em_position" class="field" placeholder="Должность"><input id="em_department" class="field" placeholder="Отдел">

function saveEmployee(){
  const first_name=document.getElementById('em_first_name').value;
  if(!first_name){ document.getElementById('emError').textContent='Укажите имя'; return; }
  const payload={ first_name, last_name:document.getElementById('em_last_name').value, position:document.getElementById('em_position').value, department:document.getElementById('em_department').value, phone:document.getElementById('em_phone').value, email:document.getElementById('em_email').value, hire_date:document.getElementById('em_hire_date').value, inn:document.getElementById('em_inn').value };
  apiFetch('/api/employees',{method:'POST',body:JSON.stringify(payload)}).then(()=>{ closeModal(); loadEmployees(); }).catch(e=>document.getElementById('emError').textContent=e.message);
}
function openEmployeeDetail(id){ apiFetch('/api/employees/'+id).then(d=>renderEmployeeDetail(d)).catch(e=>flash(e.message)); }

function addEmpSub(path, id, body){ apiFetch('/api/employees/'+id+'/'+path,{method:'POST',body:JSON.stringify(body)}).then(()=>openEmployeeDetail(id)).catch(e=>flash(e.message)); }
function deleteEmpSub(path, itemId, empId){ apiFetch('/api/'+path+'/'+itemId,{method:'DELETE'}).then(()=>openEmployeeDetail(empId)).catch(e=>flash(e.message)); }
function addEmpContact(id){ addEmpSub('contacts', id, {label:document.getElementById('ec_label').value, phone:document.getElementById('ec_phone').value}); }
function addEmpLateness(id){ addEmpSub('lateness', id, {date:document.getElementById('el_date').value, minutes:Number(document.getElementById('el_minutes').value||0), note:document.getElementById('el_note').value}); }
function addEmpContract(id){ addEmpSub('contracts', id, {title:document.getElementById('ect_title').value, start_date:document.getElementById('ect_start').value, end_date:document.getElementById('ect_end').value}); }
function addEmpVacation(id){ addEmpSub('vacations', id, {start_date:document.getElementById('ev_start').value, end_date:document.getElementById('ev_end').value, type:document.getElementById('ev_type').value}); }
function addEmpAdvance(id){ addEmpSub('advances', id, {date:document.getElementById('ea_date').value, amount:Number(document.getElementById('ea_amount').value||0)}); }
function addEmpAsset(id){ addEmpSub('assets', id, {item_name:document.getElementById('eas_name').value, serial_number:document.getElementById('eas_serial').value, issue_date:document.getElementById('eas_issue').value}); }
function deleteEmployee(id){ if(!confirm('Удалить сотрудника?')) return; apiFetch('/api/employees/'+id,{method:'DELETE'}).then(()=>{ closeModal(); loadEmployees(); }).catch(e=>flash(e.message)); }

/* ---------------- BANNERS ---------------- */
function loadBanners(){ fetch('/api/banners').then(r=>r.json()).then(d=>{ cache.banners=d; renderBanners(); }).catch(()=>{}); }
function renderBanners(){
  const banners=cache.banners||[];
  document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
      <p style="font-size:13px;color:#6e6e73;margin:0;flex:1">Баннеры показываются вверху сайта друг за другом.</p>
      <input id="bannerFileInput" type="file" accept="image/*" class="hidden" onchange="onBannerFile(event)">
      <button class="btn btn-primary" onclick="document.getElementById('bannerFileInput').click()">+ Добавить баннер</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">${banners.map(b=>`
      <div class="card" style="display:flex;gap:14px;align-items:center;padding:12px">
        <img src="${b.image_data}" onerror="this.style.display='none'" style="width:160px;height:64px;object-fit:cover;border-radius:10px;flex-shrink:0">
        <div style="flex:1;font-size:12px;color:#86868b">${b.link_url?('Ссылка: '+esc(b.link_url)):'Без ссылки'}</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary" style="width:32px;height:32px;padding:0" onclick="moveBanner(${b.id},'up')">↑</button>
          <button class="btn btn-secondary" style="width:32px;height:32px;padding:0" onclick="moveBanner(${b.id},'down')">↓</button>
          <button class="btn btn-danger" style="width:32px;height:32px;padding:0" onclick="deleteBanner(${b.id})">✕</button>
        </div>
      </div>`).join('')}</div>`;
}
function onBannerFile(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ apiFetch('/api/banners',{method:'POST',body:JSON.stringify({image_data:r.result})}).then(loadBanners).catch(err=>flash(err.message)); }; r.readAsDataURL(f); e.target.value=''; }
function deleteBanner(id){ if(!confirm('Удалить баннер?')) return; apiFetch('/api/banners/'+id,{method:'DELETE'}).then(loadBanners).catch(e=>flash(e.message)); }
function moveBanner(id,direction){ apiFetch('/api/banners/'+id+'/move',{method:'PATCH',body:JSON.stringify({direction})}).then(loadBanners).catch(e=>flash(e.message)); }
</script>
